<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Criar conta</title>
  <link rel="stylesheet" href="global.css">
</head>
<body>

  <div class="container">
    <!-- Esquerda: Placeholder da Imagem -->
    <div class="image-container"></div>

    <!-- Direita: Formulário de Registro -->
    <div class="card-container">
      <h1 class="brand-title">Hotel Pet</h1>

      <form class="register-form">
        <div class="input-group">
          <input type="text" class="form-control" placeholder="Login" required>
        </div>

        <div class="input-group">
          <input type="password" class="form-control" placeholder="Senha" required>
          <button type="button" class="password-toggle" aria-label="Mostrar senha">👁</button>
        </div>

        <button type="submit" class="btn-submit">Criar conta</button>
      </form>

      <a href="#" class="login-link">Já tem conta? Login</a>
    </div>
  </div>

</body>
</html>
