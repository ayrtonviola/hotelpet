<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Fazer Reserva</title>
<link rel="stylesheet" href="global.css">
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="brand">Hotel Pet</div>
    <ul class="nav-list">
      <li class="nav-item"><a href="#">🐾 Pet</a></li>
      <li class="nav-item active"><a href="#">📖 Reservas</a></li>
    </ul>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    
    <!-- Header -->
    <header class="header">
      <div class="user-profile">
        <div class="avatar-circle">👤</div>
        <span>João da Silva</span>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="content">
      <div class="breadcrumb">Home / revervas / nova reserva</div>

      <div class="card-container">
        <h1 class="page-title">Fazer reserva</h1>

        <form class="reservation-form">
          <div class="form-group">
            <label for="pet">Pet *</label>
            <input type="text" id="pet" class="form-control" value="Max" required>
          </div>

          <div class="form-group">
            <label>Período *</label>
            <div class="date-range-group">
              <div class="date-input-wrapper">
                <input type="date" value="2021-05-02" required>
              </div>
              <div class="date-input-wrapper">
                <input type="date" value="2021-05-07" required>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="notas">Notas</label>
            <textarea id="notas" class="form-control">Lorem ipsum dolor sit amet, consectet ui i iadipiscing elit.</textarea>
          </div>

          <div class="total-price">
            Total das diárias: <span>R$ 40,00</span>
          </div>

          <!-- Botões -->
          <div class="form-actions">
            <button type="submit" class="btn-primary">💾 Salvar</button>
            <button type="reset" class="btn-secondary">↺ Limpar</button>
          </div>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
