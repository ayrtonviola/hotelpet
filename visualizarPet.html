<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Ver Pet</title>
<link rel="stylesheet" href="global.css">
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="brand">Hotel Pet</div>
    <ul class="nav-list">
      <li class="nav-item active"><a href="#">🐾 Pets</a></li>
      <li class="nav-item"><a href="#">📖 Reservas</a></li>
    </ul>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    
    <!-- Header -->
    <header class="header">
      <div class="user-profile">
        <div class="avatar-circle">👤</div>
        <span>João da Silva</span>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="content">
      <div class="breadcrumb">Home / pets / ver pet</div>

      <div class="card-container">
        <h1 class="page-title">Ver pet</h1>

        <!-- Botões de Ação Topo -->
        <div class="top-actions">
          <button class="btn-action-outline">✏️ Editar</button>
          <button class="btn-action-outline">✖ Deletar</button>
        </div>

        <!-- Dados do Pet -->
        <div class="details-container">
          <div class="detail-row">
            <span class="detail-label">Proprietário:</span>
            <span class="detail-value">José da Silva</span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Id:</span>
            <span class="detail-value">1234509876</span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Nome:</span>
            <span class="detail-value">Max</span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Tipo:</span>
            <span class="detail-value">Cachorro</span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Raça:</span>
            <span class="detail-value">Pastor Alemão</span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Imagem</span>
            <div class="detail-value">
              <div class="image-placeholder"></div>
            </div>
          </div>

          <div class="detail-row">
            <span class="detail-label">Reservas:</span>
            <div class="detail-value reservations-list">
              <span class="res-blue">02/05/2021 - 07/05/2021 (completa)</span>
              <span class="res-green">02/05/2021 - 07/05/2021 (em andamento)</span>
            </div>
          </div>

          <!-- Botão Voltar -->
          <div class="bottom-actions">
            <button class="btn-back">← Voltar</button>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
