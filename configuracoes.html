<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Configurações</title>
<link rel="stylesheet" href="global.css">
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="brand">Hotel Pet</div>
    <ul class="nav-list">
      <li class="nav-item"><a href="#">🐾 Pet</a></li>
      <li class="nav-item"><a href="#">👤 Usuário</a></li>
      <li class="nav-item active"><a href="#">⚙ Configurações</a></li>
      <li class="nav-item"><a href="#">📖 Reservas</a></li>
    </ul>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    
    <!-- Header -->
    <header class="header">
      <div class="user-profile">
        <div class="avatar-circle">👤</div>
        <span>João da Silva</span>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="content">
      <div class="breadcrumb">Home / Configurações</div>

      <div class="card-container">
        <h1 class="page-title">Configurações</h1>

        <form class="settings-form">
          <div class="form-group">
            <label for="valor-diaria">Valor da diária</label>
            <input type="text" id="valor-diaria" class="form-control" value="R$ 10,00">
          </div>

          <div class="form-group">
            <label for="vagas">Vagas disponíveis</label>
            <input type="number" id="vagas" class="form-control" value="3">
          </div>

          <!-- Botões -->
          <div class="form-actions">
            <button type="submit" class="btn-primary">💾 Salvar</button>
            <button type="reset" class="btn-secondary">↺ Limpar</button>
          </div>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
