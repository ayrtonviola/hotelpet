<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Login</title>
<link rel="stylesheet" href="global.css">
</head>
<body>

  <div class="login-container">
    <div class="image-section"></div>

    <div class="login-section">
      <h1 class="brand-title">Hotel Pet</h1>

      <form class="login-form">
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Login" value="Login">
        </div>

        <div class="form-group">
          <input type="password" class="form-control" placeholder="Senha" value="Senha">
          <span class="toggle-password">👁</span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" checked>
            <span>matenha-me conectado</span>
          </label>
          <a href="#" class="forgot-password">Esqueci a senha</a>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>
      </form>

      <div class="divider">
        <span>ou</span>
      </div>

      <div class="social-login">
        <a href="#" class="social-btn" title="Facebook">facebook</a>
        <a href="#" class="social-btn" title="Twitter">twitter</a>
        <a href="#" class="social-btn" title="Google">google</a>
      </div>

      <a href="#" class="create-account-link">Criar uma conta</a>
    </div>
  </div>

</body>
</html>
