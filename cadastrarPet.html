<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Cadastrar pet</title>
<link rel="stylesheet" href="global.css">
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="brand">Hotel Pet</div>
    <ul class="nav-list">
      <li class="nav-item active"><a href="#">🐾 Pet</a></li>
      <li class="nav-item"><a href="#">👤 Usuários</a></li>
      <li class="nav-item"><a href="#">⚙ Configurações</a></li>
      <li class="nav-item"><a href="#">📖 Reservas</a></li>
    </ul>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    
    <!-- Header -->
    <header class="header">
      <div class="user-profile">
        <div class="avatar-circle">👤</div>
        <span>João da Silva</span>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="content">
      <div class="breadcrumb">Home / Pet / Novo Pet</div>

      <div class="card-container">
        <h1 class="page-title">Novo Pet</h1>

        <form>
          <div class="form-content">
            <!-- Coluna dos Campos -->
            <div class="form-fields">
              <div class="form-group">
                <label for="proprietario">Proprietário *</label>
                <input type="text" id="proprietario" class="form-control" required>
              </div>

              <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" class="form-control" required>
              </div>

              <div class="form-group">
                <label for="tipo">Tipo *</label>
                <select id="tipo" class="form-control" required>
                  <option value=""></option>
                  <option value="cachorro">Cachorro</option>
                  <option value="gato">Gato</option>
                  <option value="outro">Outro</option>
                </select>
              </div>

              <div class="form-group">
                <label for="raca">Raça *</label>
                <input type="text" id="raca" class="form-control" required>
              </div>

              <div class="form-group">
                <label for="tamanho">Tamanho *</label>
                <select id="tamanho" class="form-control" required>
                  <option value=""></option>
                  <option value="pequeno">Pequeno</option>
                  <option value="medio">Médio</option>
                  <option value="grande">Grande</option>
                </select>
              </div>
            </div>

            <!-- Coluna da Imagem -->
            <div class="image-upload-section">
              <label>Imagem</label>
              <div class="image-placeholder"></div>
            </div>
          </div>

          <!-- Botões -->
          <div class="form-actions">
            <button type="submit" class="btn-primary">💾 Salvar</button>
            <button type="reset" class="btn-secondary">↺ Limpar</button>
          </div>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
