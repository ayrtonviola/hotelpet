<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Cadastrar Usuário</title>
  <link rel="stylesheet" href="global.css">
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="brand">Hotel Pet</div>
    <ul class="nav-list">
      <li class="nav-item"><a href="#">🐾 Pet</a></li>
      <li class="nav-item active"><a href="#">👤 Usuários</a></li>
      <li class="nav-item"><a href="#">⚙ Configurações</a></li>
      <li class="nav-item"><a href="#">📖 Reservas</a></li>
    </ul>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    
    <!-- Header -->
    <header class="header">
      <div class="user-profile">
        <div class="avatar-circle">👤</div>
        <span>João da Silva</span>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="content">
      <div class="breadcrumb">Home / Usuário / Novo usuário</div>

      <div class="card-container">
        <h1 class="page-title">Editar Perfil</h1>

        <form class="profile-form">
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" class="form-control" value="joaodasilva@pet.com" required>
          </div>

          <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" class="form-control" value="João" required>
          </div>

          <div class="form-group">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" class="form-control" value="da Silva">
          </div>

          <div class="form-group">
            <label for="telefone">Telefone *</label>
            <input type="tel" id="telefone" class="form-control" value="+55 (73) 99876-8943" required>
          </div>

          <div class="form-group">
            <label for="funcao">Função</label>
            <select id="funcao" class="form-control">
              <option value="funcionario" selected>Funcionário</option>
            </select>
            <div class="dropdown-options-box">
              <div>Cliente</div>
              <div>Gerente</div>
            </div>
          </div>

          <!-- Placeholder de Imagem -->
          <div class="image-placeholder"></div>

          <!-- Botões -->
          <div class="form-actions">
            <button type="submit" class="btn-primary">💾 Salvar</button>
            <button type="reset" class="btn-secondary">↺ Limpar</button>
          </div>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
